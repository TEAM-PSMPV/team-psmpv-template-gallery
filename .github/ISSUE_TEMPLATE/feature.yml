name: Feature request
description: Propose an improvement to the gallery
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain the user need before describing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request contains no private or security-sensitive information.
          required: true
